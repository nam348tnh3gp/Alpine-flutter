name: Build Alpine Runner APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.22.2"
  KOTLIN_VERSION: "1.9.22"
  JAVA_VERSION: "17"
  APP_NAME: "alpinerunner"
  ORG: "com.TGFN"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Increment version code
        run: |
          if [ -f versioncode.txt ]; then
            VERSION_CODE=$(cat versioncode.txt | tr -d '\r')
          else
            VERSION_CODE=0
          fi
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          VERSION_NAME=$(grep 'version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '\r')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          NEW_VERSION="${VERSION_NAME}+${NEW_VERSION_CODE}"
          sed -i "s/version: .*/version: $NEW_VERSION/" pubspec.yaml
          echo $NEW_VERSION_CODE > versioncode.txt
          echo "✅ Version set to: $NEW_VERSION"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_ENV

      - name: Create Flutter project
        run: |
          flutter create --org ${{ env.ORG }} --project-name ${{ env.APP_NAME }} --platforms=android build_workspace

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p build_workspace/android/app
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > build_workspace/android/app/upload-keystore.jks
          if [ ! -s build_workspace/android/app/upload-keystore.jks ]; then
            echo "❌ Keystore file is empty!"
            exit 1
          fi
          echo "✅ Keystore restored"

      - name: Create key.properties
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p build_workspace/android
          cat > build_workspace/android/key.properties << EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "✅ key.properties created"

      - name: Copy source and Android config
        run: |
          # Copy lib và pubspec
          rm -rf build_workspace/lib
          cp -r lib build_workspace/lib
          cp -f pubspec.yaml build_workspace/pubspec.yaml

          # AndroidManifest
          cp -f overrides/android/app/src/main/AndroidManifest.xml \
                build_workspace/android/app/src/main/AndroidManifest.xml

          # Tạo thư mục Kotlin package com.TNGF.alpinerunner
          mkdir -p build_workspace/android/app/src/main/kotlin/${ORG//./\/}/${APP_NAME}

          # Copy MainActivity.kt
          cp -f overrides/android/app/src/main/kotlin/com/TNGF/alpinerunner/MainActivity.kt \
                build_workspace/android/app/src/main/kotlin/${ORG//./\/}/${APP_NAME}/MainActivity.kt

          # Copy ProotLauncher.kt
          cp -f overrides/android/app/src/main/kotlin/com/TNGF/alpinerunner/ProotLauncher.kt \
                build_workspace/android/app/src/main/kotlin/${ORG//./\/}/${APP_NAME}/ProotLauncher.kt

          # Copy app/build.gradle
          cp -f overrides/android/app/build.gradle build_workspace/android/app/build.gradle

          # Copy C++ source
          mkdir -p build_workspace/android/app/src/main/cpp
          cp -f overrides/android/app/src/main/cpp/CMakeLists.txt \
                build_workspace/android/app/src/main/cpp/
          cp -f overrides/android/app/src/main/cpp/proot_launcher.c \
                build_workspace/android/app/src/main/cpp/

          # Xoá MainActivity mặc định nếu khác
          find build_workspace/android/app/src/main/kotlin -name "MainActivity.kt" \
            -not -path "*${APP_NAME}/MainActivity.kt" -delete || true

      - name: Set Kotlin version
        run: |
          sed -i -E "s/(id \"org\.jetbrains\.kotlin\.android\" version )\"[^\"]*\"/\1\"${KOTLIN_VERSION}\"/" \
            build_workspace/android/settings.gradle
          grep "org.jetbrains.kotlin.android" build_workspace/android/settings.gradle

      - name: Copy start-gui.sh to assets
        run: |
          mkdir -p build_workspace/assets/rootfs-scripts
          cp overrides/rootfs-scripts/start-gui.sh build_workspace/assets/rootfs-scripts/start-gui.sh
          if ! grep -q "assets/rootfs-scripts/" build_workspace/pubspec.yaml; then
            python3 scripts/patch_pubspec_assets.py build_workspace/pubspec.yaml
          fi

      - name: Fetch native binaries
        working-directory: build_workspace
        run: |
          cp -f ../scripts/fetch_native_binaries.sh .
          chmod +x fetch_native_binaries.sh
          ./fetch_native_binaries.sh

      - name: Flutter pub get
        working-directory: build_workspace
        run: flutter pub get

      - name: Build APK
        working-directory: build_workspace
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alpine-runner-apk
          path: build_workspace/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Commit version changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml versioncode.txt
          git commit -m "Bump version to $(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r') [skip ci]" || echo "No changes to commit"
