name: Build Alpine Runner APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: "3.22.2"
  KOTLIN_VERSION: "1.8.22"
  JAVA_VERSION: "17"
  APP_NAME: "alpine_runner"
  ORG: "com.example"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (chứa lib/, pubspec.yaml, overrides/, scripts/)
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Tạo project Flutter mới (khung android/ios chuẩn)
        run: |
          flutter create --org ${{ env.ORG }} --project-name ${{ env.APP_NAME }} --platforms=android build_workspace
          flutter --version

      - name: Copy source code (lib/, pubspec.yaml) vào project mới, GHI ĐÈ
        run: |
          rm -rf build_workspace/lib
          cp -r lib build_workspace/lib
          cp -f pubspec.yaml build_workspace/pubspec.yaml

      - name: Ghi đè cấu hình Android (Manifest, MainActivity, app/build.gradle)
        run: |
          set -e
          # AndroidManifest + MainActivity tuỳ chỉnh
          cp -f overrides/android/app/src/main/AndroidManifest.xml \
                build_workspace/android/app/src/main/AndroidManifest.xml

          mkdir -p build_workspace/android/app/src/main/kotlin/${ORG//./\/}/${APP_NAME}
          cp -f overrides/android/app/src/main/kotlin/com/example/alpinerunner/MainActivity.kt \
                build_workspace/android/app/src/main/kotlin/${ORG//./\/}/${APP_NAME}/MainActivity.kt

          # CHỈ ghi đè app/build.gradle. KHÔNG động vào android/build.gradle hay
          # android/settings.gradle -- giữ nguyên bản `flutter create` sinh ra vì
          # template Flutter 3.22 quản lý AGP/Kotlin qua settings.gradle
          # (declarative plugins block), không dùng flutterVersionCode kiểu cũ nữa.
          cp -f overrides/android/app/build.gradle build_workspace/android/app/build.gradle

          # Xoá package MainActivity mặc định do `flutter create` sinh ra (nếu khác namespace)
          find build_workspace/android/app/src/main/kotlin -name "MainActivity.kt" \
            -not -path "*${APP_NAME}/MainActivity.kt" -delete || true
        env:
          ORG: ${{ env.ORG }}
          APP_NAME: ${{ env.APP_NAME }}

      - name: sed - ép Kotlin version = 1.8.22 trong settings.gradle (template mới)
        run: |
          set -e
          # Template Flutter 3.22 khai báo kotlin version trong pluginManagement
          # ở android/settings.gradle, dạng:
          #   id "org.jetbrains.kotlin.android" version "x.x.x" apply false
          sed -i -E "s/(id \"org\.jetbrains\.kotlin\.android\" version )\"[^\"]*\"/\1\"${KOTLIN_VERSION}\"/" \
            build_workspace/android/settings.gradle
          echo "Kết quả sau khi sed:"
          grep "org.jetbrains.kotlin.android" build_workspace/android/settings.gradle

      - name: Copy script khởi động GUI vào assets (sẽ chép vào rootfs lúc bootstrap)
        run: |
          set -e
          mkdir -p build_workspace/assets/rootfs-scripts
          cp overrides/rootfs-scripts/start-gui.sh build_workspace/assets/rootfs-scripts/start-gui.sh

          # Đăng ký asset trong pubspec.yaml nếu chưa có.
          # Lưu ý: toàn bộ heredoc bên dưới phải thụt lề >= thụt lề của "run: |"
          # (10 spaces) để không bị YAML hiểu nhầm là kết thúc block scalar.
          if ! grep -q "assets/rootfs-scripts/" build_workspace/pubspec.yaml; then
            python3 - <<'PY'
          import re
          p = "build_workspace/pubspec.yaml"
          s = open(p).read()
          target = "flutter:\n  uses-material-design: true\n"
          replacement = (
              "flutter:\n"
              "  uses-material-design: true\n"
              "  assets:\n"
              "    - assets/rootfs-scripts/start-gui.sh\n"
          )
          if target in s:
              s = s.replace(target, replacement)
          else:
              s += "\n  assets:\n    - assets/rootfs-scripts/start-gui.sh\n"
          open(p, "w").write(s)
          print("Đã thêm asset vào pubspec.yaml")
          PY
          fi

      - name: Tải native binaries (proot, busybox) -> jniLibs/lib*.so
        working-directory: build_workspace
        run: |
          cp -f ../scripts/fetch_native_binaries.sh .
          chmod +x fetch_native_binaries.sh
          ./fetch_native_binaries.sh

      - name: flutter pub get
        working-directory: build_workspace
        run: flutter pub get

      - name: Kiểm tra extractNativeLibs đã đúng
        working-directory: build_workspace
        run: |
          grep -q 'extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml

      - name: Build APK release (chỉ arm64 + arm32, split theo ABI)
        working-directory: build_workspace
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alpine-runner-apk
          path: |
            build_workspace/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
