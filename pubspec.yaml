name: alpine_runner
description: Chạy Alpine Linux trên Android qua proot (CLI + GUI/VNC), không cần root.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: 3.22.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  # Ghim CỨNG (không dùng ^) - xterm 3.5.0+ đổi sang API bàn phím KeyEvent
  # mới, gây lỗi kiểu "RawKeyEvent can't be assigned to KeyEvent" khi build
  # với Flutter SDK 3.22.x. Bản 3.4.0 tương thích ổn định với Flutter 3.22.
  xterm: ^4.0.0
  url_launcher: ^6.3.0
  http: ^1.2.1
  tar: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true