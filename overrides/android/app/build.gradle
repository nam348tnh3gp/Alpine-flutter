plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.alpinerunner"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.alpinerunner"
        minSdk = 26
        targetSdk = 28   // 🔥 bypass W^X
        versionCode = 1
        versionName = "1.0.0"
    }

    // 🔥 Tắt lint ExpiredTargetSdkVersion vì app không publish lên Play Store
    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ["**/*.so"]
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }

    sourceSets {
        main.jniLibs.srcDirs += ["src/main/jniLibs"]
    }
}

flutter {
    source = "../.."
}

dependencies {}