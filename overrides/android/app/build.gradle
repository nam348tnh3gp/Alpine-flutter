plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.alpinerunner"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.alpinerunner"
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        // KHÔNG dùng flutter.versionCode / flutter.versionName: property này
        // được thêm/đổi cách expose (property vs method) qua lại giữa các
        // bản Flutter Gradle Plugin gần đây và gây lỗi "unknown property"
        // tuỳ đúng version pin. App nội bộ nên hardcode thẳng cho chắc.
        versionCode = 1
        versionName = "1.0.0"

        // KHÔNG khai ndk.abiFilters ở đây: khi build bằng `--split-per-abi`,
        // Flutter Gradle Plugin tự cấu hình khối android.splits.abi, và nó
        // xung đột (Gradle lỗi "Conflicting configuration") nếu abiFilters
        // cũng được set thủ công. Việc giới hạn chỉ còn arm64-v8a +
        // armeabi-v7a (bỏ x86_64) được làm qua cờ --target-platform khi
        // gọi `flutter build apk`, xem .github/workflows/build.yml.
    }

    // QUAN TRỌNG cho việc "lách" W^X: ép extract lib*.so ra nativeLibraryDir
    // thay vì chạy thẳng từ APK nén.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ["**/*.so"]
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }

    sourceSets {
        main.jniLibs.srcDirs += ["src/main/jniLibs"]
    }
}

flutter {
    source = "../.."
}

dependencies {}
